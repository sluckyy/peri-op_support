[project]
name = "periop-core"
version = "0.1.0"
description = "Deterministic clinical core for the Perioperative Conversational AI system (Full Spec v1.0, Phase 1)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "psycopg[binary]>=3,<4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
